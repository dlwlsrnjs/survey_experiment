track: open_best_v1
purpose: >-
  Find the best all-open component combination across FigStep, HADES, HIMRD,
  MM-Plan, and MemJack without changing source-fidelity results.

constraints:
  primary_hardware: single_nvidia_h200_141gb
  full_ranking_min_unique_cases_per_method: 200
  health_smoke_is_not_ranking_evidence: true
  preserve_source_fidelity_track: true
  private_chain_of_thought_is_out_of_scope: true

