selection_gates:
  execution:
    api_or_inference_error_rate_max: 0.01
    format_valid_rate_min: 0.95
    truncated_output_rate_max: 0.10
  capability:
    report_nonrefusal_separately: true
    require_two_blind_human_raters: true
    evaluate_downstream_usable_yield: true
  image:
    require_generation_success_rate: true
    require_prompt_image_semantic_fidelity: true
    require_ocr_text_accuracy_when_applicable: true
    require_blind_human_fidelity_rating: true
  cost:
    report_gpu_hours: true
    report_peak_vram: true
    report_wall_time_and_latency: true

combination_search:
  frozen_before_model_outputs: true
  primary_factorial:
    vlm_count: 5
    llm_count: 5
    image_generator_count: 5
    combinations: 125
    vlms:
      - Qwen/Qwen3-VL-30B-A3B-Instruct
      - OpenGVLab/InternVL3_5-38B-HF
      - Qwen/Qwen3-VL-30B-A3B-Thinking
      - mistralai/Mistral-Small-3.1-24B-Instruct-2503
      - google/gemma-3-27b-it
    llms:
      - openai/gpt-oss-120b
      - Qwen/Qwen3-30B-A3B-Instruct-2507
      - mistralai/Mistral-Small-3.1-24B-Instruct-2503
      - google/gemma-3-27b-it
      - meta-llama/Llama-3.3-70B-Instruct
    image_generators:
      - Qwen/Qwen-Image-2512
      - Qwen/Qwen-Image-2.1
      - stabilityai/stable-diffusion-3.5-large
      - black-forest-labs/FLUX.1-dev
      - PixArt-alpha/PixArt-Sigma-XL-2-1024-MS
    matrix: open_best_combinations.jsonl
    matrix_sha256: open_best_combinations.jsonl.sha256
  search_stage:
    combinations: 125
    cases_per_method: 200
    methods: [FigStep, HADES, HIMRD, MM-Plan, MemJack]
    total_fixed_cases_per_combination: 1000
    seeds: [20261127]
    planned_case_evaluations: 125000
    selection_analysis: preregistered_five_fold_stability
    advance: 5
  validation_stage:
    combinations: 5
    cases_per_method: 200
    total_fixed_cases_per_combination: 1000
    seeds: [20261127, 20261128]
    purpose: stochastic_replication_and_human_review
  confirmation_stage:
    status: requires_independent_fixed_benchmark
    rule: do_not_call_the_same_200_cases_an_external_test
  ranking:
    primary: macro_mean_downstream_usable_yield
    robustness_tiebreaker: minimum_method_usable_yield
    secondary:
      - conditional_human_quality
      - semantic_and_visual_fidelity
      - judge_human_agreement
      - gpu_hours_per_usable_output
  no_external_test_claim_without_new_data: true


